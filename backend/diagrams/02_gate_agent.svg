<svg viewBox="0 0 820 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="900" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="820" height="64" fill="#dbeafe"/>
  <text x="30" y="30" font-size="21" font-weight="700" fill="#1e3a8a">Gate Agent</text>
  <text x="30" y="50" font-size="13" fill="#1e40af">agents/gate_agent.py · gate_agent_node()</text>
  <rect x="660" y="18" width="130" height="26" rx="13" fill="#2563eb"/>
  <text x="725" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">RULE-BASED</text>

  <!-- Step 1 -->
  <rect x="260" y="90" width="300" height="55" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">board = state.snapshot</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#3b82f6">(read-only — never state.board)</text>
  <path d="M410,145 L410,170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="200" y="170" width="420" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="200" text-anchor="middle" font-size="13" fill="#1e3a8a">available_gates = gates where gate_status == OPEN</text>
  <path d="M410,220 L410,250" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop container -->
  <rect x="60" y="250" width="700" height="530" rx="14" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="85" y="275" font-size="13" font-weight="700" fill="#2563eb">for flight in board.flights.values():</text>

  <!-- Decision 1 -->
  <polygon points="380,295 520,345 380,395 240,345" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="338" text-anchor="middle" font-size="11.5" fill="#713f12">status == LANDED</text>
  <text x="380" y="354" text-anchor="middle" font-size="11.5" fill="#713f12">and no assigned_gate?</text>

  <!-- skip branch: short, self-contained, no long lines -->
  <path d="M520,345 L590,345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="335" text-anchor="middle" font-size="11" fill="#64748b">no</text>
  <rect x="590" y="320" width="120" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="650" y="340" text-anchor="middle" font-size="10.5" fill="#475569">↺ skip to</text>
  <text x="650" y="354" text-anchor="middle" font-size="10.5" fill="#475569">next flight</text>

  <path d="M380,395 L380,420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="412" font-size="11" fill="#64748b">yes</text>

  <!-- decide_gate_assignment -->
  <rect x="200" y="420" width="360" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="380" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">decide_gate_assignment(flight, available_gates)</text>
  <text x="380" y="463" text-anchor="middle" font-size="11" fill="#3b82f6">→ proposed_gate_id or None</text>
  <path d="M380,480 L380,505" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 2 -->
  <polygon points="380,505 550,560 380,615 210,560" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="553" text-anchor="middle" font-size="11.5" fill="#713f12">proposed_gate_id</text>
  <text x="380" y="569" text-anchor="middle" font-size="11.5" fill="#713f12">is not None?</text>

  <!-- yes / no reasoning boxes, side by side below, symmetric -->
  <path d="M300,595 L220,635" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="610" text-anchor="middle" font-size="11" fill="#64748b">yes</text>
  <rect x="90" y="635" width="260" height="55" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="657" text-anchor="middle" font-size="11" fill="#166534">reasoning: "Gate is open</text>
  <text x="220" y="673" text-anchor="middle" font-size="11" fill="#166534">and compatible"</text>

  <path d="M460,595 L540,635" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="530" y="610" text-anchor="middle" font-size="11" fill="#64748b">no</text>
  <rect x="470" y="635" width="260" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="657" text-anchor="middle" font-size="11" fill="#991b1b">reasoning: "No compatible</text>
  <text x="600" y="673" text-anchor="middle" font-size="11" fill="#991b1b">gate available this tick"</text>

  <path d="M220,690 L220,730 L380,730" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M600,690 L600,730 L380,730" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Always emit proposal -->
  <rect x="140" y="730" width="480" height="45" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="380" y="757" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Always append GateAssignmentProposal (bug fix — see note below)</text>

  <!-- side note card -->
  <rect x="590" y="410" width="150" height="150" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="665" y="432" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d">Bug fix</text>
  <text x="665" y="450" text-anchor="middle" font-size="9.5" fill="#991b1b">Even a None</text>
  <text x="665" y="463" text-anchor="middle" font-size="9.5" fill="#991b1b">proposal is now</text>
  <text x="665" y="476" text-anchor="middle" font-size="9.5" fill="#991b1b">sent, so total</text>
  <text x="665" y="489" text-anchor="middle" font-size="9.5" fill="#991b1b">scarcity can't go</text>
  <text x="665" y="502" text-anchor="middle" font-size="9.5" fill="#991b1b">silently invisible.</text>
  <text x="665" y="518" text-anchor="middle" font-size="9.5" fill="#991b1b">Orchestrator turns</text>
  <text x="665" y="531" text-anchor="middle" font-size="9.5" fill="#991b1b">it into an unresolved</text>
  <text x="665" y="544" text-anchor="middle" font-size="9.5" fill="#991b1b">Conflict instead.</text>

  <!-- Return -->
  <path d="M380,775 L380,800" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="800" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="380" y="830" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">return {"proposals": proposals}</text>

  <text x="410" y="875" text-anchor="middle" font-size="11.5" fill="#64748b">Never writes shared state — single-writer principle (Decision #19)</text>
  <text x="410" y="892" text-anchor="middle" font-size="11" fill="#94a3b8">airport-ops · agents/gate_agent.py</text>
</svg>
