<svg viewBox="0 0 820 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="900" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="820" height="64" fill="#ffedd5"/>
  <text x="30" y="30" font-size="21" font-weight="700" fill="#7c2d12">Disruption Agent</text>
  <text x="30" y="50" font-size="13" fill="#9a3412">agents/disruption_agent.py · disruption_agent_node()</text>
  <rect x="650" y="18" width="140" height="26" rx="13" fill="#ea580c"/>
  <text x="720" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">LLM-POWERED</text>

  <!-- Design note box -->
  <rect x="60" y="80" width="700" height="80" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="410" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Important scope note</text>
  <text x="410" y="119" text-anchor="middle" font-size="11" fill="#7c2d12">core/simulator.py already auto-injects scripted disruptions once trigger_time arrives.</text>
  <text x="410" y="135" text-anchor="middle" font-size="11" fill="#7c2d12">This agent does NOT decide whether one fires — it only re-escalates ones</text>
  <text x="410" y="151" text-anchor="middle" font-size="11" fill="#7c2d12">already injected, each tick they remain unresolved.</text>

  <path d="M410,160 L410,185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step: board = snapshot -->
  <rect x="260" y="185" width="300" height="55" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="207" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">board = state.snapshot</text>
  <text x="410" y="225" text-anchor="middle" font-size="11" fill="#ea580c">(read-only — never state.board)</text>

  <path d="M410,240 L410,265" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop container -->
  <rect x="60" y="265" width="700" height="480" rx="14" fill="none" stroke="#fdba74" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="85" y="290" font-size="13" font-weight="700" fill="#ea580c">for disruption in board.open_disruptions:</text>

  <!-- Decision: resolved? -->
  <polygon points="380,310 520,360 380,410 240,360" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="365" text-anchor="middle" font-size="12" fill="#713f12">disruption.resolved?</text>

  <path d="M520,360 L590,360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="350" text-anchor="middle" font-size="11" fill="#64748b">yes</text>
  <rect x="590" y="335" width="130" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="655" y="355" text-anchor="middle" font-size="10.5" fill="#475569">↺ skip — already</text>
  <text x="655" y="369" text-anchor="middle" font-size="10.5" fill="#475569">handled</text>

  <path d="M380,410 L380,435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="427" font-size="11" fill="#64748b">no</text>

  <!-- LLM call -->
  <rect x="170" y="435" width="480" height="95" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <text x="410" y="461" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">reasoning = await decide_disruption_priority(disruption)</text>
  <text x="410" y="481" text-anchor="middle" font-size="11" fill="#9a3412">ChatGoogleGenerativeAI (Gemini) call, structured output</text>
  <text x="410" y="498" text-anchor="middle" font-size="11" fill="#9a3412">Falls back to a deterministic reasoning string on any</text>
  <text x="410" y="515" text-anchor="middle" font-size="11" fill="#9a3412">API failure — never crashes the tick</text>

  <path d="M410,530 L410,555" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- append proposal -->
  <rect x="190" y="555" width="440" height="75" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="580" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Append DisruptionInjectionProposal</text>
  <text x="410" y="598" text-anchor="middle" font-size="11" fill="#166534">carries the LLM's reasoning + the disruption_event</text>
  <text x="410" y="615" text-anchor="middle" font-size="10.5" fill="#22c55e" font-style="italic">re-escalates it into Orchestrator's attention this tick</text>

  <!-- Return -->
  <path d="M410,630 L410,690" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="690" width="300" height="45" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="410" y="718" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">return {"proposals": proposals}</text>

  <text x="410" y="785" text-anchor="middle" font-size="11.5" fill="#64748b">Never writes shared state — single-writer principle (Decision #19)</text>
  <text x="410" y="805" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Future scope (not implemented): agent-predicted NEW disruptions, not just escalation of scripted ones</text>
  <text x="410" y="850" text-anchor="middle" font-size="11" fill="#94a3b8">airport-ops · agents/disruption_agent.py</text>
</svg>
