<svg viewBox="0 0 820 950" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="950" fill="#ffffff"/>

  <!-- Title -->
  <rect x="0" y="0" width="820" height="64" fill="#cffafe"/>
  <text x="30" y="30" font-size="21" font-weight="700" fill="#155e75">ATS Agent</text>
  <text x="30" y="50" font-size="13" fill="#0e7490">agents/ats_agent.py · ats_agent_node()</text>
  <rect x="660" y="18" width="130" height="26" rx="13" fill="#0891b2"/>
  <text x="725" y="36" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">RULE-BASED</text>

  <!-- Step 1 -->
  <rect x="230" y="90" width="360" height="55" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">board = state.snapshot</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#0891b2">terminal_statuses = {DEPARTED, CANCELLED}</text>
  <path d="M410,145 L410,175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop container -->
  <rect x="60" y="175" width="700" height="600" rx="14" fill="none" stroke="#67e8f9" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="85" y="200" font-size="13" font-weight="700" fill="#0891b2">for flight in board.flights.values():</text>

  <!-- Decision 1: terminal? -->
  <polygon points="380,220 520,270 380,320 240,270" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="264" text-anchor="middle" font-size="11.5" fill="#713f12">status in</text>
  <text x="380" y="280" text-anchor="middle" font-size="11.5" fill="#713f12">terminal_statuses?</text>

  <path d="M520,270 L590,270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="260" text-anchor="middle" font-size="11" fill="#64748b">yes</text>
  <rect x="590" y="245" width="130" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="655" y="265" text-anchor="middle" font-size="10.5" fill="#475569">↺ skip — flight</text>
  <text x="655" y="279" text-anchor="middle" font-size="10.5" fill="#475569">already finished</text>

  <path d="M380,320 L380,345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="337" font-size="11" fill="#64748b">no</text>

  <!-- Decision 2: already flagged? -->
  <polygon points="380,345 545,395 380,445 215,395" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="380" y="389" text-anchor="middle" font-size="11.5" fill="#713f12">_already_flagged</text>
  <text x="380" y="405" text-anchor="middle" font-size="11.5" fill="#713f12">(board, flight_id)?</text>

  <path d="M545,395 L615,395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="580" y="385" text-anchor="middle" font-size="11" fill="#64748b">yes</text>
  <rect x="615" y="370" width="130" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="390" text-anchor="middle" font-size="10.5" fill="#475569">↺ skip — already</text>
  <text x="680" y="404" text-anchor="middle" font-size="10.5" fill="#475569">flagged once</text>

  <!-- bug fix note for decision 2 -->
  <rect x="90" y="455" width="580" height="55" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="380" y="475" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7f1d1d">Bug fix: flags each flight ONCE, not every tick</text>
  <text x="380" y="492" text-anchor="middle" font-size="10" fill="#991b1b">previously flooded decision_log with near-duplicate entries, drowning out the interesting reasoning</text>

  <path d="M380,445 L380,470 L90,470" stroke="#f87171" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>

  <path d="M380,445 L380,530" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="490" font-size="11" fill="#64748b">no</text>

  <!-- decide_delay_risk -->
  <rect x="220" y="530" width="380" height="55" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <text x="410" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#155e75">decide_delay_risk(flight, board.current_tick)</text>
  <text x="410" y="571" text-anchor="middle" font-size="11" fill="#0891b2">→ at_risk: bool</text>
  <path d="M410,585 L410,610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: at_risk -->
  <polygon points="410,610 530,660 410,710 290,660" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="410" y="665" text-anchor="middle" font-size="12" fill="#713f12">at_risk?</text>

  <path d="M530,660 L600,660" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="650" text-anchor="middle" font-size="11" fill="#64748b">no</text>
  <rect x="600" y="635" width="130" height="50" rx="25" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="665" y="655" text-anchor="middle" font-size="10.5" fill="#475569">↺ skip — not</text>
  <text x="665" y="669" text-anchor="middle" font-size="10.5" fill="#475569">at risk</text>

  <path d="M410,710 L410,735" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="727" font-size="11" fill="#64748b">yes</text>

  <!-- append proposal -->
  <rect x="180" y="735" width="460" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="755" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Append ScheduleUpdateProposal (delay_risk_flag = True)</text>

  <!-- Return -->
  <path d="M410,765 L410,825" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="260" y="825" width="300" height="45" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="410" y="853" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">return {"proposals": proposals}</text>

  <text x="410" y="908" text-anchor="middle" font-size="11.5" fill="#64748b">Never writes shared state — single-writer principle (Decision #19)</text>
  <text x="410" y="928" text-anchor="middle" font-size="11" fill="#94a3b8">airport-ops · agents/ats_agent.py</text>
</svg>
